<form (ngSubmit)="onSubmit()">
  <div>
    <label for="username">Username</label>
    <input id="username" [(ngModel)]="username" name="username" placeholder="Username" required />
  </div>
  <div>
    <label for="password">Password</label>
    <input id="password" [(ngModel)]="password" name="password" type="password" placeholder="Password" required />
  </div>
  <button type="submit">Log In</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
